name: Build Spread

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v7
      - name: Build screen saver
        run: ./build.sh "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: Spread-${{ matrix.arch }}
          path: build/${{ matrix.arch }}/Spread-${{ matrix.arch }}.saver.zip

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*.saver.zip
